name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p android-app/keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android-app/keystore/laudadmin-release.jks

      - name: Build signed APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "${KS_PASS}" ]; then export KS_PASS=laudadmin2026; fi
          bash android-app/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: laud-admin-release-apk
          path: android-app/build/*.apk
